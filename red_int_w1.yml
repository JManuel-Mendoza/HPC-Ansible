- name: Configurar red interna punto a punto entre master y worker1
  hosts:
    - master
    - worker1
  become: yes

  vars:
    # INTERFAZ E IP EN EL MASTER
    master_internal_if: "enp3s0f1"
    master_internal_ip: "10.10.1.1/30"

    # INTERFAZ E IP EN EL WORKER1
    worker1_internal_if: "enp3s0f1"
    worker1_internal_ip: "10.10.1.2/30"

  tasks:
    #################################################################
    # MASTER: configurar la interfaz interna que va al worker1
    #################################################################
    - name: Crear/actualizar conexión interna en el master
      when: inventory_hostname == "master"
      ansible.builtin.shell: |
        # Si no existe la conexión, la creamos
        nmcli con show int-worker1 >/dev/null 2>&1 || \
        nmcli con add type ethernet ifname {{ master_internal_if }} con-name int-worker1 \
          ipv4.method manual ipv4.addresses {{ master_internal_ip }} ipv6.method ignore

        # Aseguramos que tenga la IP correcta y sin IPv6
        nmcli con mod int-worker1 ipv4.addresses {{ master_internal_ip }} ipv4.method manual ipv6.method ignore

        # Levantamos la conexión
        nmcli con up int-worker1

    #################################################################
    # WORKER1: configurar la interfaz interna que va al master
    #################################################################
    - name: Crear/actualizar conexión interna en worker1
      when: inventory_hostname == "worker1"
      ansible.builtin.shell: |
        # Si no existe la conexión, la creamos
        nmcli con show int-master >/dev/null 2>&1 || \
        nmcli con add type ethernet ifname {{ worker1_internal_if }} con-name int-master \
          ipv4.method manual ipv4.addresses {{ worker1_internal_ip }} ipv6.method ignore

        # Aseguramos que tenga la IP correcta y sin IPv6
        nmcli con mod int-master ipv4.addresses {{ worker1_internal_ip }} ipv4.method manual ipv6.method ignore

        # Levantamos la conexión
        nmcli con up int-master
