- name: Limpiar configuracion de red en todos los nodos (conservar solo eno1)
  hosts: all
  become: yes

  tasks:
    - name: Obtener lista de conexiones de NetworkManager asociadas a interfaces distintas de eno1
      ansible.builtin.shell: |
        nmcli -t -f NAME,DEVICE con show | awk -F: '$2 != "eno1" && $2 != "" {print $1}'
      register: conexiones_a_borrar

    - name: Mostrar conexiones que se van a borrar (solo informativo)
      ansible.builtin.debug:
        var: conexiones_a_borrar.stdout_lines

    - name: Borrar conexiones de todas las interfaces excepto eno1
      when: conexiones_a_borrar.stdout != ""
      ansible.builtin.command: nmcli con delete "{{ item }}"
      loop: "{{ conexiones_a_borrar.stdout_lines }}"
