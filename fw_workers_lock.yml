- name: Restringir SSH en workers para que solo el master pueda entrar
  hosts: workers
  become: yes

  vars:
    master_ip_worker1: "10.10.1.1"
    master_ip_worker2: "10.10.2.1"

  tasks:
    - name: Asegurar que firewalld esté habilitado y corriendo
      ansible.builtin.shell: |
        systemctl enable --now firewalld

    # WORKER1: permitir ssh solo desde 10.10.1.1
    - name: Configurar firewall en worker1
      when: inventory_hostname == "worker1"
      ansible.builtin.shell: |
        # Añadimos una regla que permite ssh solo desde la IP interna del master
        firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="{{ master_ip_worker1 }}/32" service name="ssh" accept'

        # Quitamos el servicio ssh general (que permitía ssh desde cualquier lado)
        firewall-cmd --permanent --remove-service=ssh || true

        # Aplicamos cambios
        firewall-cmd --reload

    # WORKER2: permitir ssh solo desde 10.10.2.1
    - name: Configurar firewall en worker2
      when: inventory_hostname == "worker2"
      ansible.builtin.shell: |
        firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="{{ master_ip_worker2 }}/32" service name="ssh" accept'
        firewall-cmd --permanent --remove-service=ssh || true
        firewall-cmd --reload
