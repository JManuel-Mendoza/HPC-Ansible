---
- name: Validación SLURM (smoke tests)
  hosts: hpc_master
  become: true
  gather_facts: false

  vars:
    slurm_validate_nodes: "{{ groups.get('workers_r', []) | default([]) }}"
    slurm_validate_chdir: "{{ slurm_default_chdir | default('/tmp') }}"

  tasks:
    - name: Slurm validate | Ensure slurm defaults script exists
      ansible.builtin.stat:
        path: /etc/profile.d/slurm-defaults.sh
      register: _slurm_defaults
      tags: [slurm, slurm_validate]

    - name: Slurm validate | Fail if defaults script missing
      ansible.builtin.fail:
        msg: "Missing /etc/profile.d/slurm-defaults.sh (slurm env defaults not installed)."
      when: not _slurm_defaults.stat.exists
      tags: [slurm, slurm_validate]

    - name: Slurm validate | Show nodes visible to controller
      ansible.builtin.command: sinfo -lN
      register: _sinfo
      changed_when: false
      tags: [slurm, slurm_validate]

    - name: Slurm validate | Print sinfo
      ansible.builtin.debug:
        var: _sinfo.stdout_lines
      tags: [slurm, slurm_validate]

    - name: Slurm validate | srun hostname on each compute node (no --chdir)
      ansible.builtin.shell: |
        set -euo pipefail
        source /etc/profile.d/slurm-defaults.sh
        srun -N1 -w {{ item }} hostname
      args:
        executable: /bin/bash
      register: _srun_hostname
      changed_when: false
      loop: "{{ slurm_validate_nodes }}"
      when: slurm_validate_nodes | length > 0
      tags: [slurm, slurm_validate]

    - name: Slurm validate | srun nvidia-smi (gpu partition) on each compute node
      ansible.builtin.shell: |
        set -euo pipefail
        source /etc/profile.d/slurm-defaults.sh
        srun -N1 -w {{ item }} --gres=gpu:1 nvidia-smi -L
      args:
        executable: /bin/bash
      register: _srun_gpu
      changed_when: false
      loop: "{{ slurm_validate_nodes }}"
      when: slurm_validate_nodes | length > 0
      tags: [slurm, slurm_validate]
