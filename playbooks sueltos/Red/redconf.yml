- name: Configurar toda la red interna entre master y workers 1-4
  hosts:
    - master
    - worker1
    - worker2
    - worker3
    - worker4
  become: yes

  vars:
    # Mapa de enlaces internos
     
    internal_links:
      worker1:
        master_if: "enp3s0f1"         
        master_ip: "192.168.34.1/28"
        worker_if: "enp3s0f1"   
        worker_ip: "192.168.34.2/28"
      worker2:
        master_if: "enp3s0f2"          
        master_ip: "192.168.34.17/28"
        worker_if: "enp3s0f2"
        worker_ip: "192.168.34.18/28"
      worker3:
        master_if: "enp3s0f3"
        master_ip: "192.168.34.33/28"
        worker_if: "enp3s0f3"
        worker_ip: "192.168.34.34/28"
      worker4:
        master_if: "enp3s0f0"
        master_ip: "192.168.34.49/28"
        worker_if: "enp3s0f0"
        worker_ip: "192.168.34.50/28"

  tasks:
    #################################################################
    # 1) MASTER: configurar todas las interfaces internas
    #################################################################
    - name: Configurar enlaces internos en el master
      when: inventory_hostname == "master"
      ansible.builtin.shell: |
        {% for w, cfg in internal_links.items() %}
        nmcli con show int-{{ w }} >/dev/null 2>&1 || \
        nmcli con add type ethernet ifname {{ cfg.master_if }} con-name int-{{ w }} \
          ipv4.method manual ipv4.addresses {{ cfg.master_ip }} ipv6.method ignore

        nmcli con mod int-{{ w }} ipv4.addresses {{ cfg.master_ip }} ipv4.method manual ipv6.method ignore
        nmcli con up int-{{ w }}
        {% endfor %}

    #################################################################
    # 2) WORKERS: configurar su enlace interno al master
    #################################################################
    - name: Obtener configuración del enlace interno para cada worker
      when: inventory_hostname != "master"
      ansible.builtin.set_fact:
        my_link: "{{ internal_links[inventory_hostname] }}"

    - name: Configurar interfaz interna en cada worker
      when: inventory_hostname != "master"
      ansible.builtin.shell: |
        nmcli con show int-master >/dev/null 2>&1 || \
        nmcli con add type ethernet ifname {{ my_link.worker_if }} con-name int-master \
          ipv4.method manual ipv4.addresses {{ my_link.worker_ip }} ipv6.method ignore

        nmcli con mod int-master ipv4.addresses {{ my_link.worker_ip }} ipv4.method manual ipv6.method ignore
        nmcli con up int-master
