- name: Configurar NFS para el proyecto LLM (master)
  hosts: master
  become: yes

  vars:
    nfs_export: /export/llm-project
    nfs_allowed_net: 192.168.34.0/24

  tasks:
    - name: Instalar nfs-utils y firewalld en el master
      package:
        name:
          - nfs-utils
          - firewalld
        state: present

    - name: Crear carpeta de export para el proyecto LLM
      file:
        path: "{{ nfs_export }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Asegurar que la línea de export exista en /etc/exports
      lineinfile:
        path: /etc/exports
        line: "{{ nfs_export }} {{ nfs_allowed_net }}(rw,sync,no_root_squash,no_subtree_check)"
        state: present
        create: yes

    - name: Habilitar y arrancar servicios NFS y firewalld en el master
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - firewalld
        - nfs-server

    - name: Permitir NFS solo desde la red interna
      shell: >
        firewall-cmd --permanent --add-rich-rule='rule family="ipv4"
        source address="{{ nfs_allowed_net }}" service name="nfs" accept'
      changed_when: true

    - name: Recargar firewalld
      shell: firewall-cmd --reload
      changed_when: true

    - name: Recargar exports NFS en el master
      command: exportfs -ra


- name: Configurar NFS client para el proyecto LLM (workers)
  hosts: worker1,worker2
  become: yes

  vars:
    nfs_export: /export/llm-project
    nfs_mount: /mnt/llm-project
    master_internal_ips:
      worker1: "192.168.34.1"
      worker2: "192.168.34.17"

  tasks:
    - name: Instalar cliente NFS en workers
      package:
        name: nfs-utils
        state: present

    - name: Crear punto de montaje en workers
      file:
        path: "{{ nfs_mount }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Obtener IP interna del master para este worker
      set_fact:
        my_master_ip: "{{ master_internal_ips[inventory_hostname] }}"

    - name: Asegurar entrada de NFS en /etc/fstab
      lineinfile:
        path: /etc/fstab
        state: present
        create: yes
        regexp: '^{{ my_master_ip }}:{{ nfs_export }}\s'
        line: '{{ my_master_ip }}:{{ nfs_export }}  {{ nfs_mount }}  nfs  defaults,_netdev  0  0'

    - name: Montar todos los sistemas de archivos (incluyendo NFS)
      command: mount -a
      changed_when: true
