---
- name: Bootstrap sudo NOPASSWD for Ansible user
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Ensure sudoers drop-in for sistemas
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-ansible
        content: |
          sistemas ALL=(ALL) NOPASSWD: ALL
          Defaults:sistemas !requiretty
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"

    - name: Validate non-interactive sudo works
      ansible.builtin.command: "sudo -n whoami"
      register: sudo_test
      changed_when: false

    - name: Print sudo test result
      ansible.builtin.debug:
        var: sudo_test.stdout
