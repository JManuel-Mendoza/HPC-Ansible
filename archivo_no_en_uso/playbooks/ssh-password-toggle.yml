---
- name: Toggle SSH password authentication
  hosts: all
  become: true
  serial: 1
  vars:
    ssh_password_auth: "no"
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
  tasks:
    - name: SSH Toggle | Set PasswordAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^(?i)\s*PasswordAuthentication\s+'
        line: "PasswordAuthentication {{ ssh_password_auth }}"
        backrefs: false
      register: sshd_config_update
      notify: Restart sshd

    - name: SSH Toggle | Validate sshd_config
      ansible.builtin.command: sshd -t -f /etc/ssh/sshd_config
      register: sshd_validate
      changed_when: false
      when: sshd_config_update is changed

    - name: SSH Toggle | Fail if sshd_config invalid
      ansible.builtin.fail:
        msg: >-
          sshd_config validation failed; sshd will not be restarted.
          stderr={{ sshd_validate.stderr | default('') }}
      when:
        - sshd_config_update is changed
        - sshd_validate.rc != 0

    - name: SSH Toggle | Verify PasswordAuthentication
      ansible.builtin.command: /bin/sh -c "sshd -T | grep -i '^passwordauthentication '"
      register: sshd_effective
      changed_when: false

    - name: SSH Toggle | Assert PasswordAuthentication matches
      ansible.builtin.fail:
        msg: >-
          PasswordAuthentication mismatch. Expected {{ ssh_password_auth }},
          got: {{ sshd_effective.stdout | default('') }}
      when: "('passwordauthentication ' ~ ssh_password_auth) not in (sshd_effective.stdout | lower)"
