run_name: "finetune_lora"
seed: 42

paths:
  base_model_dir: "artifacts/checkpoints/pretrain_tiny/final"
  processed_dir: "data/processed"
  output_dir: "artifacts/checkpoints/finetune_lora"

data:
  train_file: "train.txt"
  val_file: "val.txt"
  block_size: 256

train:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_steps: 100
  num_train_epochs: 1
  logging_steps: 20
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  fp16: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "c_attn"
    - "c_proj"
