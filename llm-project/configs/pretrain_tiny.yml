run_name: "pretrain_tiny"
seed: 42

paths:
  processed_dir: "data/processed"
  tokenizer_dir: "artifacts/tokenizer"
  output_dir: "artifacts/checkpoints/pretrain_tiny"

data:
  train_file: "train.txt"
  val_file: "val.txt"
  block_size: 256

model:
  n_layer: 6
  n_head: 6
  n_embd: 384
  n_positions: 256

train:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  warmup_steps: 200
  num_train_epochs: 1
  weight_decay: 0.1
  logging_steps: 20
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  fp16: true
