common_packages:
  - git
  - curl
  - wget
  - vim
  - rsync
  - tar
  - unzip
  - htop
  - tmux
  - jq

enable_chrony: true

# =====================
# SSH (password habilitado)
# =====================
ssh_port: 22
ssh_permit_root_login: "yes"
ssh_password_authentication: "yes"

# =====================
# NFS / LLM paths
# =====================
llm_nfs_export_dir: "/export/llm-project"
llm_nfs_mount_dir: "/mnt/llm-project"
llm_internal_cidr: "192.168.34.0/24"

# =====================
# LLM env (micromamba)
# =====================
llm_conda_packages:
  - python
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda

llm_pip_packages:
  - transformers
  - datasets
  - accelerate
  - peft
  - safetensors
  - sentencepiece

llm_python_packages:
  - numpy
  - torch
  - transformers

# =====================
# Firewall Rules
# =====================

# Slurm firewall
slurm_firewalld_zone: "public"
slurm_internal_cidr: "192.168.34.0/24"
slurmctld_port: 6817
slurmd_port: 6818


# =====================
# SLURM-Munge settings
# =====================

munge_uid: 1011
munge_gid: 1011
slurm_uid: 1012
slurm_gid: 1012

munge_key_host: master   # nombre de inventario del master
munge_key_size_mb: 4

# =====================
# --- Slurm core ---
# =====================
slurm_version: "23.11.3"
slurm_tarball_url: "https://download.schedmd.com/slurm/slurm-{{ slurm_version }}.tar.bz2"

slurm_etc_dir: /etc/slurm
slurm_log_dir: /var/log/slurm

# cgroup
slurm_cgroup_conf: |
  CgroupPlugin=autodetect

# control machine
# Para construir slurm.conf a partir de facts
slurm_control_machine: "master"     # nombre de inventario del master
slurm_mem_reserve_mb: 1024          # reserva RAM para el SO (MB)

# Define particiones por grupos de inventario
slurm_partitions:
  - name: debug
    groups: ["slurm_compute"]
    default: true
    max_time: "INFINITE"
    state: "UP"
  - name: gpu
    groups: ["slurm_gpu"]
    default: false
    max_time: "INFINITE"
    state: "UP"
    shared: "YES"

slurm_srun_port_range: "60001-60100"

# Slurm: directorio por defecto para srun/sbatch/salloc cuando NO se pasa --chdir/-D
slurm_default_chdir: "/tmp"