common_packages:
  - git
  - curl
  - wget
  - vim
  - rsync
  - tar
  - unzip
  - htop
  - tmux
  - jq

enable_chrony: true

# =====================
# SSH (password habilitado)
# =====================
ssh_port: 22
ssh_permit_root_login: "yes"
ssh_password_authentication: "yes"

# =====================
# NFS / LLM paths
# =====================
llm_nfs_export_dir: "/export/llm-project"
llm_nfs_mount_dir: "/mnt/llm-project"
llm_internal_cidr: "192.168.34.0/24"

# =====================
# LLM env (micromamba)
# =====================
llm_conda_packages:
  - python
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda

llm_pip_packages:
  - transformers
  - datasets
  - accelerate
  - peft
  - safetensors
  - sentencepiece

llm_python_packages:
  - numpy
  - torch
  - transformers
