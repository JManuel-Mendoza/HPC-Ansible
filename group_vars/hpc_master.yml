# Interfaces internas del master que actúan como “router” entre subredes.
hpc_router_internal_ifaces:
  - enp3s0f1
  - enp3s0f2
  - enp3s0f3
  - enp3s0f0
# MariaDB module stream (Rocky/RHEL)
mariadb_module_stream: "10.11"

# NFS HPC (servidor)
nfs_hpc_server_enabled: true

# NFS LLM (servidor nuevo)
llm_nfs_enabled: true
llm_nfs_partition: /dev/sda2
llm_nfs_fs_type: xfs
llm_nfs_fs_mountpoint: /srv/nfs
llm_nfs_export_dir: /srv/nfs/llm
llm_nfs_allowed_clients: "192.168.34.0/24"
llm_nfs_export_opts: "rw,sync,no_subtree_check"
llm_nfs_group: llmusers
llm_nfs_mode: "2770"
llm_nfs_wipe_mount: true

# SlurmDB MariaDB settings
slurmdb_mysql_db: "slurm_acct_db"
slurmdb_mysql_user: "slurm"

slurmdb_mysql_password: "1234"
slurmdb_mysql_hosts:
  - "localhost"
  - "master"

mariadb_slurm_tuning:
  innodb_buffer_pool_size: "4096M"
  innodb_log_file_size: "64M"
  innodb_lock_wait_timeout: "900"
  max_allowed_packet: "500M"

slurmdbd_port: 6819
slurmdbd_host: "localhost"
slurmdbd_storage_host: "localhost"
slurmdbd_storage_loc: "{{ slurmdb_mysql_db }}"   # slurm_acct_db
slurmdbd_storage_user: "{{ slurmdb_mysql_user | first}}" # slurm
slurmdbd_storage_pass: "{{ slurmdb_mysql_password }}" # 1234
