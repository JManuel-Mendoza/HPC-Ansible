# Proposito:
# - Definir variables de inventario para el alcance 'hpc_master' con impacto transversal en roles/playbooks.
# Supuestos/prerrequisitos:
# - Las claves aqui declaradas deben ser compatibles con defaults de roles y grupos existentes en inventario.
# Variables clave consumidas:
# - Variables globales de cluster (red, Slurm, NFS, CUDA, validaciones) y sus overrides por host.
# Tags relevantes:
# - N/A directo en este archivo; las tags se evalúan en playbooks/tasks consumidoras.

# Interfaces internas del master que actúan como “router” entre subredes.
hpc_router_internal_ifaces:
  - enp3s0f1
  - enp3s0f2
  - enp3s0f3
  - enp3s0f0
# MariaDB module stream (Rocky/RHEL)
mariadb_module_stream: "10.11"

# NFS HPC (servidor)
nfs_hpc_server_enabled: true

# SlurmDB MariaDB settings
slurmdb_mysql_db: "slurm_acct_db"
slurmdb_mysql_user: "slurm"

slurmdb_mysql_password: "1234"
slurmdb_mysql_hosts:
  - "localhost"
  - "master"

mariadb_slurm_tuning:
  innodb_buffer_pool_size: "4096M"
  innodb_log_file_size: "64M"
  innodb_lock_wait_timeout: "900"
  max_allowed_packet: "500M"

slurmdbd_port: 6819
slurmdbd_host: "localhost"
slurmdbd_storage_host: "localhost"
slurmdbd_storage_loc: "{{ slurmdb_mysql_db }}"   # slurm_acct_db
slurmdbd_storage_user: "{{ (((slurmdb_mysql_user is string) | ternary([slurmdb_mysql_user], (slurmdb_mysql_user | default([]) | list))) | first) | default('slurm') }}"
slurmdbd_storage_pass: "{{ slurmdb_mysql_password }}"
