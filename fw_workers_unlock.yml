- name: Revertir restricciones de SSH en workers (volver a ssh abierto)
  hosts: workers
  become: yes

  vars:
    master_ip_worker1: "10.10.1.1"
    master_ip_worker2: "10.10.2.1"

  tasks:
    - name: Asegurar que firewalld esté activo
      ansible.builtin.shell: |
        systemctl enable --now firewalld

    - name: Quitar rich rule de worker1 (si existe)
      when: inventory_hostname == "worker1"
      ansible.builtin.shell: |
        firewall-cmd --permanent --remove-rich-rule='rule family="ipv4" source address="{{ master_ip_worker1 }}/32" service name="ssh" accept' || true
        firewall-cmd --permanent --add-service=ssh
        firewall-cmd --reload

    - name: Quitar rich rule de worker2 (si existe)
      when: inventory_hostname == "worker2"
      ansible.builtin.shell: |
        firewall-cmd --permanent --remove-rich-rule='rule family="ipv4" source address="{{ master_ip_worker2 }}/32" service name="ssh" accept' || true
        firewall-cmd --permanent --add-service=ssh
        firewall-cmd --reload
