- name: Configurar red interna punto a punto entre master y worker2
  hosts:
    - master
    - worker2
  become: yes

  vars:
    # INTERFAZ E IP EN EL MASTER PARA WORKER2
    master_internal_if_w2: "enp3s0f2"
    master_internal_ip_w2: "10.10.2.1/30"

    # INTERFAZ E IP EN EL WORKER2
    # Si el nombre de la interfaz interna del worker2 fuera otro, cámbialo aquí
    worker2_internal_if: "enp3s0f2"
    worker2_internal_ip: "10.10.2.2/30"

  tasks:
    #################################################################
    # MASTER: configurar la interfaz interna que va al worker2
    #################################################################
    - name: Crear/actualizar conexión interna en el master para worker2
      when: inventory_hostname == "master"
      ansible.builtin.shell: |
        # Si no existe la conexión, la creamos
        nmcli con show int-worker2 >/dev/null 2>&1 || \
        nmcli con add type ethernet ifname {{ master_internal_if_w2 }} con-name int-worker2 \
          ipv4.method manual ipv4.addresses {{ master_internal_ip_w2 }} ipv6.method ignore

        # Aseguramos que tenga la IP correcta y sin IPv6
        nmcli con mod int-worker2 ipv4.addresses {{ master_internal_ip_w2 }} ipv4.method manual ipv6.method ignore

        # Levantamos la conexión
        nmcli con up int-worker2

    #################################################################
    # WORKER2: configurar la interfaz interna que va al master
    #################################################################
    - name: Crear/actualizar conexión interna en worker2
      when: inventory_hostname == "worker2"
      ansible.builtin.shell: |
        # Si no existe la conexión, la creamos
        nmcli con show int-master >/dev/null 2>&1 || \
        nmcli con add type ethernet ifname {{ worker2_internal_if }} con-name int-master \
          ipv4.method manual ipv4.addresses {{ worker2_internal_ip }} ipv6.method ignore

        # Aseguramos que tenga la IP correcta y sin IPv6
        nmcli con mod int-master ipv4.addresses {{ worker2_internal_ip }} ipv4.method manual ipv6.method ignore

        # Levantamos la conexión
        nmcli con up int-master
