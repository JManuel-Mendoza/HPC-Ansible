---
- name: Etapa 1 | Baseline HPC (common + ssh)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: common, tags: ["common"] }
    - { role: users_ssh, tags: ["ssh"] }

- name: Etapa 2 | Red interna + ruteo + firewall
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: network_internal, tags: ["network", "network_internal"] }
    - { role: cluster_routing, tags: ["routing"] }
    - { role: firewall, tags: ["firewall"] }

- name: Etapa 3 | CUDA/Driver NVIDIA (solo nodos con GPU)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: nvidia_cuda, tags: ["cuda"] }

- name: Etapa 4 | NFS HPC (server export)
  hosts: hpc_master
  become: true
  gather_facts: true
  roles:
    - { role: nfs_hpc, tags: ["nfs"] }

- name: Etapa 5 | NFS HPC (clientes mount)
  hosts: "all:!hpc_master"
  become: true
  gather_facts: true
  roles:
    - { role: nfs_hpc, tags: ["nfs"] }

- name: Etapa 6 | MariaDB en master
  hosts: hpc_master
  become: true
  gather_facts: true
  roles:
    - { role: mariadb_server, tags: ["mariadb"] }

- name: Etapa 7 | Preparar SlurmDB en MariaDB (master)
  hosts: hpc_master
  become: true
  gather_facts: true
  roles:
    - { role: slurm_db_prep, tags: ["mariadb", "slurmdb"] }

- name: Etapa 8 | Configuración de identidades SLURM
  hosts: slurm_all
  become: true
  roles:
    - role: slurm_identities
      tags: [slurm, munge, identities]

- name: Etapa 9 | Configuración de Munge en nodos SLURM
  hosts: slurm_all
  become: true
  roles:
    - role: munge
      tags: [munge]

- name: Etapa 10 | Recopilación de hechos SLURM en nodos SLURM
  hosts: slurm_all
  become: true
  roles:
    - role: slurm_facts
      tags: [slurm, slurm_facts, slurm_config]

- name: Etapa 11 | Configuración de SLURM en nodo master
  hosts: hpc_master
  become: true
  roles:
    - role: slurm_rpm_build
      tags: [slurm, slurm_rpm_build]
    - role: slurm_install
      tags: [slurm, slurm_install]
    - { role: slurm_controller, tags: ["slurm", "slurm_config"] }

- name: Etapa 12 | Configuración de SLURM en nodos compute
  hosts: slurm_compute
  become: true
  roles:
    - role: slurm_install
      tags: [slurm, slurm_install, slurm_config]
    - role: slurm_compute
      tags: [slurm, slurm_config]

- name: Etapa 13 | Entorno LLM (micromamba + torch)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: llm_env, tags: ["llm"] }

- name: Etapa 14 | Validación general de salud del clúster
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: validate, tags: ["validate"] }

- name: Etapa 15 | Validación Slurm (sin cambios de configuración)
  hosts: hpc_master
  become: true
  roles:
    - role: slurm_validate
      tags: [slurm_validate]
