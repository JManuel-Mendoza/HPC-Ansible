---
- name: Etapa 1 | Baseline HPC (common + ssh)
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Preflight | Recolectar facts (play 1)
      ansible.builtin.setup:
        gather_subset:
          - all
      tags: [common, ssh]
  roles:
    - { role: common, tags: ["common"] }
    - { role: users_ssh, tags: ["ssh"] }

- name: Etapa 2 | Red interna + ruteo + firewall
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Preflight | Recolectar facts (play 2)
      ansible.builtin.setup:
        gather_subset:
          - all
      tags: [debug, debug_firewall, firewall, network, network_internal, nmcli, routing, slurm, slurm_firewall, slurm_validate, sysctl]
  roles:
    - { role: network_internal, tags: ["network", "network_internal"] }
    - { role: cluster_routing, tags: ["routing"] }
    - { role: firewall, tags: ["firewall"] }

- name: Etapa 3 | CUDA/Driver NVIDIA (solo nodos con GPU)
