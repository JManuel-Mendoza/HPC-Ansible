---
- name: Baseline para todos los nodos (SO + SSH + Firewall + GPU/CUDA + Entorno LLM)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: common, tags: ["common"] }
    - { role: users_ssh, tags: ["ssh"] }
    - { role: firewall, tags: ["firewall"] }
    - { role: network_internal, tags: ["network_internal"] }
    - { role: nvidia_cuda, tags: ["cuda"] }
    - { role: llm_env, tags: ["llm"] }

- name: Configuración NFS en master
  hosts: hpc_master
  become: true
  gather_facts: true
  roles:
    - { role: nfs_server, tags: ["nfs"] }
    - { role: llm_project, tags: ["llm_project"] }

- name: Configuración NFS en workers
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - { role: nfs_client, tags: ["nfs"] }

- name: Validación de salud del clúster
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: validate, tags: ["validate"] }

- name: Configuración de identidades SLURM
  hosts: all
  become: true
  roles:
    - role: slurm_identities
      tags: [slurm, munge, identities]

- name: Configuración de munge en nodos SLURM
  hosts: all
  become: true
  roles:
    - role: munge
      tags: [munge]

