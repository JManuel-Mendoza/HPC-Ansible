# Proposito:
# - Implementar tareas del rol 'common' para aplicar baseline comun del sistema operativo.
# Supuestos/prerrequisitos:
# - El play debe ejecutar con privilegios adecuados y facts disponibles; se asume conectividad al host objetivo.
# Variables clave consumidas:
# - roles/common/defaults/main.yml (si existe), group_vars/* y host_vars/* segun alcance.
# Tags relevantes:
# - Heredadas desde site.yml y/o invocaciones parciales por --tags.

---
- name: Habilitar el repositorio EPEL
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Actualizar caché de paquetes
  ansible.builtin.dnf:
    update_cache: true

- name: Instalar paquetes base
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present

- name: Instalar chrony si aplica
  ansible.builtin.dnf:
    name: chrony
    state: present
  when: enable_chrony | bool

- name: Habilitar chronyd si aplica
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
  when: enable_chrony | bool
