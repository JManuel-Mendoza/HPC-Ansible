---
- name: Slurm | Ensure log dir exists (compute)
  ansible.builtin.file:
    path: "{{ slurm_log_dir }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
  tags: [slurm, slurm_config]

- name: Slurm | Ensure slurmd spool dir exists (compute)
  ansible.builtin.file:
    path: /var/spool/slurmd
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
  tags: [slurm, slurm_config]

- name: Slurm | Touch slurmd log (compute)
  ansible.builtin.file:
    path: "{{ slurm_log_dir }}/slurmd.log"
    state: touch
    owner: slurm
    group: slurm
    mode: "0644"
  tags: [slurm, slurm_config]

- name: Slurm | Reload systemd units (compute)
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [slurm, slurmd]

- name: Slurm | Enable and start slurmd (compute)
  ansible.builtin.systemd:
    name: slurmd
    enabled: true
    state: started
  tags: [slurm, slurmd]

- name: Slurm | Restart slurmd if slurm.conf changed (compute)
  ansible.builtin.systemd:
    name: slurmd
    state: restarted
  when: slurm_conf_changed | default(false)
  tags: [slurm, slurmd]
