# Proposito:
# - Implementar tareas del rol 'slurm_install' para instalar binarios, unidades y archivos base de Slurm.
# Supuestos/prerrequisitos:
# - El play debe ejecutar con privilegios adecuados y facts disponibles; se asume conectividad al host objetivo.
# Variables clave consumidas:
# - roles/slurm_install/defaults/main.yml (si existe), group_vars/* y host_vars/* segun alcance.
# Tags relevantes:
# - Heredadas desde site.yml y/o invocaciones parciales por --tags.

---
- name: SlurmDBD | Crear tmpfiles para /run/slurm
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/slurm-run.conf
    content: "d /run/slurm 0755 slurm slurm -\n"
    owner: root
    group: root
    mode: "0644"
  notify: SlurmDBD | Aplicar tmpfiles
  tags: [slurmdbd_hygiene]

- name: SlurmDBD | Crear /run/slurm en caliente
  ansible.builtin.file:
    path: /run/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
  tags: [slurmdbd_hygiene]

- name: SlurmDBD | Crear slurmdbd.conf base si falta
  ansible.builtin.copy:
    dest: "{{ slurm_etc_dir }}/slurmdbd.conf"
    content: ""
    owner: slurm
    group: slurm
    mode: "0600"
    force: false
  tags: [slurmdbd_hygiene]

- name: SlurmDBD | Asegurar PidFile en slurmdbd.conf
  ansible.builtin.lineinfile:
    path: "{{ slurm_etc_dir }}/slurmdbd.conf"
    regexp: '^PidFile='
    line: 'PidFile=/run/slurm/slurmdbd.pid'
    insertafter: EOF
    create: false
  notify: SlurmDBD | Reiniciar slurmdbd
  tags: [slurmdbd_hygiene]

- name: SlurmDBD | Asegurar SlurmUser en slurmdbd.conf
  ansible.builtin.lineinfile:
    path: "{{ slurm_etc_dir }}/slurmdbd.conf"
    regexp: '^SlurmUser='
    line: 'SlurmUser=slurm'
    insertafter: EOF
    create: false
  notify: SlurmDBD | Reiniciar slurmdbd
  tags: [slurmdbd_hygiene]
