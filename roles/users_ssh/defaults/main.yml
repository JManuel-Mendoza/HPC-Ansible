# Proposito:
# - Declarar valores por defecto del rol 'users_ssh' para mantener comportamiento reproducible y sobrescribible.
# Supuestos/prerrequisitos:
# - Los valores pueden ser sobreescritos por group_vars/host_vars sin editar tareas del rol.
# Variables clave consumidas:
# - Variables definidas en este archivo; origen de override: group_vars/* y host_vars/*.
# Tags relevantes:
# - N/A directo en este archivo; consumidas por tasks/handlers del rol.

---
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "yes"
ssh_pubkey_authentication: "yes"
ssh_use_pam: "yes"
ssh_kbdinteractive_authentication: "yes"
ssh_allow_groups: []
