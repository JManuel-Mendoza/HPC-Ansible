# Proposito:
# - Definir handlers del rol 'nfs_hpc' para aplicar cambios diferidos solo cuando hay notify.
# Supuestos/prerrequisitos:
# - Los handlers se ejecutan al final del play o tras flush_handlers; requieren servicios instalados previamente.
# Variables clave consumidas:
# - Parametros definidos en defaults/vars del rol y estados calculados por tasks que notifican.
# Tags relevantes:
# - No aplican tags directas; se activan por notify desde tasks etiquetadas.

---
- name: NFS | Recargar exports
  ansible.builtin.command: exportfs -ra

- name: NFS | Recargar firewalld
  ansible.builtin.command: firewall-cmd --reload
