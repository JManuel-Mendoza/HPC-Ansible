---
- name: Validate | Show hostname and OS
  ansible.builtin.command: uname -a
  register: uname_out
  changed_when: false

- name: Validate | Print uname
  ansible.builtin.debug:
    var: uname_out.stdout

- name: Validate | Check SSH password auth effective config (sshd -T)
  ansible.builtin.shell: |
    set -euo pipefail
    sshd -T | egrep -i 'passwordauthentication|usepam|kbdinteractiveauthentication|port|permitrootlogin'
  args:
    executable: /bin/bash
  register: sshd_t
  changed_when: false

- name: Validate | Print sshd -T relevant lines
  ansible.builtin.debug:
    var: sshd_t.stdout_lines

- name: Validate | NFS export exists on master
  ansible.builtin.stat:
    path: "{{ validate_nfs_export_path }}"
  register: st_export
  when: validate_nfs | bool and inventory_hostname in groups.get('hpc_master', [])

- name: Validate | Fail if NFS export dir missing on master
  ansible.builtin.fail:
    msg: "NFS export path missing on master: {{ validate_nfs_export_path }}"
  when: validate_nfs | bool and inventory_hostname in groups.get('hpc_master', []) and not st_export.stat.exists

- name: Validate | NFS mount exists on workers
  ansible.builtin.stat:
    path: "{{ validate_nfs_mount_path }}"
  register: st_mount
  when: validate_nfs | bool and inventory_hostname in groups.get('workers', [])

- name: Validate | Fail if NFS mount dir missing on worker
  ansible.builtin.fail:
    msg: "NFS mount path missing on worker: {{ validate_nfs_mount_path }}"
  when: validate_nfs | bool and inventory_hostname in groups.get('workers', []) and not st_mount.stat.exists

- name: Validate | Definir ruta del proyecto LLM
  ansible.builtin.set_fact:
    _llm_project_path: "{{ (inventory_hostname in groups.get('hpc_master', [])) | ternary(validate_nfs_export_path, validate_nfs_mount_path) }}"
  when: validate_llm | bool

- name: Validate | Verificar ruta del proyecto LLM
  ansible.builtin.stat:
    path: "{{ _llm_project_path }}"
  register: st_llm_project
  when: validate_llm | bool

- name: Validate | Fallar si falta ruta del proyecto LLM
  ansible.builtin.fail:
    msg: "Ruta del proyecto LLM no existe: {{ _llm_project_path }}"
  when: validate_llm | bool and not st_llm_project.stat.exists

- name: Validate | Verificar script smoke GPU
  ansible.builtin.stat:
    path: "{{ _llm_project_path }}/scripts/00_smoke_gpu.py"
  register: st_llm_smoke
  when: validate_llm | bool

- name: Validate | Fallar si falta script smoke GPU
  ansible.builtin.fail:
    msg: "Falta script smoke GPU: {{ _llm_project_path }}/scripts/00_smoke_gpu.py"
  when: validate_llm | bool and not st_llm_smoke.stat.exists

- name: Validate | Check nvidia-smi
  ansible.builtin.command: nvidia-smi -L
  register: nvsmi
  changed_when: false
  failed_when: validate_cuda | bool and (nvsmi.rc != 0)

- name: Validate | Print nvidia-smi
  ansible.builtin.debug:
    var: nvsmi.stdout_lines

- name: Validate | Check Torch CUDA inside micromamba env
  ansible.builtin.command: >
    {{ llm_micromamba_bin }} run -n {{ llm_env_name }}
    python -c "import torch; print(torch.__version__); print('cuda', torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no-gpu')"
  environment:
    MAMBA_ROOT_PREFIX: "/opt/micromamba"
  register: torch_cuda
  changed_when: false
  failed_when: false

- name: Validate | Fail if LLM env missing or Torch CUDA unavailable
  ansible.builtin.fail:
    msg: >-
      LLM env check failed (rc={{ torch_cuda.rc }}). Ensure micromamba env
      '{{ llm_env_name }}' exists and torch has CUDA. stdout={{ torch_cuda.stdout | default('') }}
      stderr={{ torch_cuda.stderr | default('') }}
  when: validate_llm | bool and (torch_cuda.rc != 0 or 'cuda True' not in torch_cuda.stdout)

- name: Validate | Print Torch CUDA check
  ansible.builtin.debug:
    var: torch_cuda.stdout_lines

- name: Validate | LLM smoke GPU (tensor op)
  ansible.builtin.command: >
    {{ llm_micromamba_bin }} run -n {{ llm_env_name }}
    python {{ _llm_project_path }}/scripts/00_smoke_gpu.py
  environment:
    MAMBA_ROOT_PREFIX: "/opt/micromamba"
  register: llm_smoke
  changed_when: false
  failed_when: false
  when: validate_llm | bool

- name: Validate | Fail si smoke GPU falla
  ansible.builtin.fail:
    msg: >-
      Smoke GPU fallo (rc={{ llm_smoke.rc }}). stdout={{ llm_smoke.stdout | default('') }}
      stderr={{ llm_smoke.stderr | default('') }}
  when: validate_llm | bool and llm_smoke.rc != 0

- name: Validate | Print smoke GPU output
  ansible.builtin.debug:
    var: llm_smoke.stdout_lines
  when: validate_llm | bool
