# Proposito:
# - Implementar tareas del rol 'validate' para ejecutar validaciones generales de salud del cluster.
# Supuestos/prerrequisitos:
# - El play debe ejecutar con privilegios adecuados y facts disponibles; se asume conectividad al host objetivo.
# Variables clave consumidas:
# - roles/validate/defaults/main.yml (si existe), group_vars/* y host_vars/* segun alcance.
# Tags relevantes:
# - Heredadas desde site.yml y/o invocaciones parciales por --tags.

---
- name: Validate | Show hostname and OS
  ansible.builtin.command: uname -a
  register: uname_out
  changed_when: false
  tags: [debug, debug_validate]

- name: Validate | Print uname
  ansible.builtin.debug:
    var: uname_out.stdout
  tags: [debug, debug_validate]

- name: Validate | Check SSH password auth effective config (sshd -T)
  ansible.builtin.shell: |
    set -euo pipefail
    sshd -T | egrep -i 'passwordauthentication|usepam|kbdinteractiveauthentication|port|permitrootlogin'
  args:
    executable: /bin/bash
  register: sshd_t
  changed_when: false
  failed_when: false
  tags: [debug, debug_validate]

- name: Validate | Print sshd -T relevant lines
  ansible.builtin.debug:
    var: sshd_t.stdout_lines
  tags: [debug, debug_validate]

- name: Validate | Recolectar service facts
  ansible.builtin.service_facts:
  changed_when: false
  tags: [validate, validate_ssh, validate_slurm, validate_cuda]

- name: Validate | SSH | Verificar servicio SSH activo
  ansible.builtin.command: >-
    systemctl is-active {{
      ('sshd.service' in (ansible_facts.services | default({})))
        | ternary('sshd', (('ssh.service' in (ansible_facts.services | default({}))) | ternary('ssh', 'sshd')))
    }}
  register: _validate_ssh_active
  changed_when: false
  failed_when: false
  tags: [validate, validate_ssh]

- name: Validate | SSH | Fallar si el servicio SSH no esta activo
  ansible.builtin.assert:
    that:
      - (_validate_ssh_active.stdout | trim) == 'active'
    fail_msg: >-
      Servicio SSH no esta activo (stdout='{{ _validate_ssh_active.stdout | default('') | trim }}', rc={{ _validate_ssh_active.rc }}).
      Accion: ejecutar `--tags ssh` (rol users_ssh) o verificar el servicio en el nodo:
      `systemctl status sshd` (Rocky/RHEL) o `systemctl status ssh` (Ubuntu/Debian).
  tags: [validate, validate_ssh]

- name: Validate | SSH | Validar sintaxis de sshd (sshd -t)
  ansible.builtin.command: sshd -t
  register: _validate_sshd_syntax
  changed_when: false
  failed_when: false
  tags: [validate, validate_ssh]

- name: Validate | SSH | Fallar si la configuracion de sshd es invalida
  ansible.builtin.assert:
    that:
      - _validate_sshd_syntax.rc == 0
    fail_msg: >-
      `sshd -t` fallo (rc={{ _validate_sshd_syntax.rc }}).
      Accion: revisar `/etc/ssh/sshd_config` y `/etc/ssh/sshd_config.d/*.conf` (por ejemplo `roles/users_ssh`),
      corregir el error y volver a ejecutar `--tags ssh`.
  tags: [validate, validate_ssh]

- name: Validate | CUDA | Detectar nvidia-smi
  ansible.builtin.stat:
    path: /usr/bin/nvidia-smi
  register: _validate_nvidia_smi_bin
  changed_when: false
  tags: [validate, validate_cuda]

- name: Validate | CUDA | Determinar si se espera GPU en este host
  ansible.builtin.set_fact:
    _validate_expect_gpu: "{{ inventory_hostname in groups.get('slurm_gpu', []) }}"
  changed_when: false
  tags: [validate, validate_cuda]

- name: Validate | Check nvidia-smi
  ansible.builtin.command: nvidia-smi -L
  register: nvsmi
  changed_when: false
  failed_when: false
  when:
    - validate_cuda | bool
    - _validate_nvidia_smi_bin.stat.exists
  tags: [validate, validate_cuda]

- name: Validate | CUDA | Fallar si nvidia-smi no esta disponible o falla
  ansible.builtin.assert:
    that:
      - nvsmi.rc == 0
    fail_msg: >-
      `nvidia-smi -L` fallo (rc={{ nvsmi.rc }}).
      Accion: ejecutar `--tags cuda` (rol nvidia_cuda) y verificar driver NVIDIA. Si este nodo no deberia validar CUDA,
      deshabilitar `validate_cuda` para este host/grupo.
  when:
    - validate_cuda | bool
    - _validate_nvidia_smi_bin.stat.exists
  tags: [validate, validate_cuda]

- name: Validate | CUDA | Fallar si se espera GPU pero no existe nvidia-smi
  ansible.builtin.assert:
    that:
      - _validate_nvidia_smi_bin.stat.exists
    fail_msg: >-
      Se esperaba GPU en este host (miembro de `slurm_gpu`), pero no existe `/usr/bin/nvidia-smi`.
      Accion: ejecutar `--tags cuda` (rol nvidia_cuda) o corregir la instalacion del driver NVIDIA.
  when:
    - validate_cuda | bool
    - _validate_expect_gpu | bool
  tags: [validate, validate_cuda]

- name: Validate | Print nvidia-smi
  ansible.builtin.debug:
    var: nvsmi.stdout_lines
  tags: [debug, debug_validate]

- name: Validate | CUDA | Detectar micromamba
  ansible.builtin.stat:
    path: "{{ llm_micromamba_bin }}"
  register: _validate_micromamba_bin
  changed_when: false
  when:
    - validate_llm | bool
    - _validate_nvidia_smi_bin.stat.exists or (_validate_expect_gpu | default(false) | bool)
  tags: [validate, validate_cuda]

- name: Validate | CUDA | Fallar si se habilito validate_llm pero falta micromamba
  ansible.builtin.assert:
    that:
      - _validate_micromamba_bin.stat.exists
    fail_msg: >-
      `validate_llm=true` pero no existe `{{ llm_micromamba_bin }}`.
      Accion: ejecutar `--tags llm` (rol llm_env) o deshabilitar `validate_llm` en este host/grupo.
  when:
    - validate_llm | bool
    - _validate_nvidia_smi_bin.stat.exists or (_validate_expect_gpu | default(false) | bool)
  tags: [validate, validate_cuda]

- name: Validate | Check Torch CUDA inside micromamba env
  ansible.builtin.command: >
    {{ llm_micromamba_bin }} run -n {{ llm_env_name }}
    python -c "import torch; print(torch.__version__); print('cuda', torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no-gpu')"
  environment:
    MAMBA_ROOT_PREFIX: "{{ llm_micromamba_root }}"
  register: torch_cuda
  changed_when: false
  failed_when: false
  when:
    - validate_llm | bool
    - _validate_nvidia_smi_bin.stat.exists or (_validate_expect_gpu | default(false) | bool)
    - _validate_micromamba_bin.stat.exists
  tags: [validate, validate_cuda]

- name: Validate | CUDA | Fallar si el entorno LLM no existe o Torch CUDA no esta disponible
  ansible.builtin.assert:
    that:
      - torch_cuda.rc == 0
      - "'cuda True' in (torch_cuda.stdout | default(''))"
    fail_msg: >-
      Check de Torch CUDA fallo (rc={{ torch_cuda.rc }}).
      Accion:
      1) confirmar que existe el env `{{ llm_env_name }}` (micromamba en `{{ llm_micromamba_bin }}`),
      2) ejecutar `--tags llm,cuda` para provisionar entorno/driver,
      3) revisar salida: stdout={{ (torch_cuda.stdout | default('') | trim)[:200] }}, stderr={{ (torch_cuda.stderr | default('') | trim)[:200] }}.
  when:
    - validate_llm | bool
    - _validate_nvidia_smi_bin.stat.exists or (_validate_expect_gpu | default(false) | bool)
  tags: [validate, validate_cuda]

- name: Validate | Print Torch CUDA check
  ansible.builtin.debug:
    var: torch_cuda.stdout_lines
  tags: [debug, debug_validate]

- name: Validate | Slurm | Determinar si hay servicios de Slurm presentes
  ansible.builtin.set_fact:
    _validate_slurm_present: >-
      {{
        ('slurmctld.service' in (ansible_facts.services | default({}))) or
        ('slurmd.service' in (ansible_facts.services | default({}))) or
        ('slurmdbd.service' in (ansible_facts.services | default({})))
      }}
  changed_when: false
  tags: [validate, validate_slurm]

- name: Validate | Slurm checks
  ansible.builtin.include_tasks: slurm.yml
  when:
    - validate_slurm | bool
  tags: [validate, validate_slurm]
