---
- name: NFS Server | Install packages
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - firewalld
    state: present
    update_cache: true

- name: NFS Server | Ensure exported directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0775"
  loop: "{{ nfs_exports }}"

- name: NFS Server | Configure /etc/exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload exports

- name: NFS Server | Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: NFS Server | Enable and start nfs-server
  ansible.builtin.service:
    name: nfs-server
    state: started
    enabled: true

# SELinux: permitir exportación RW (no fatal si SELinux no está estricto)
- name: NFS Server | Set SELinux boolean nfs_export_all_rw
  ansible.builtin.command: setsebool -P nfs_export_all_rw on
  register: _setsebool
  changed_when: false
  failed_when: false

# Firewall: permitir NFS desde el CIDR interno
- name: NFS Server | Allow rpc-bind from internal network
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ llm_internal_cidr }}" service name="rpc-bind" accept'
    permanent: true
    immediate: true
    state: enabled

- name: NFS Server | Allow mountd from internal network
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ llm_internal_cidr }}" service name="mountd" accept'
    permanent: true
    immediate: true
    state: enabled

- name: NFS Server | Allow nfs from internal network
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ llm_internal_cidr }}" service name="nfs" accept'
    permanent: true
    immediate: true
    state: enabled
