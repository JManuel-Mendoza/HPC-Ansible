---
# Nota: este rol asume que corre en el master (controller) para ejecutar sinfo/srun/sbatch.
# No cambia configuración. Todo es "changed_when: false".

- name: Validate Slurm CLI reachable (sinfo)
  ansible.builtin.command: sinfo --version
  register: _sinfo_ver
  changed_when: false
  tags: [slurm_validate]

- name: List partitions (normalized)
  ansible.builtin.shell: |
    set -euo pipefail
    sinfo -h -o "%P" | tr -d '*' | tr ' ' '\n' | sed '/^$/d' | sort -u
  args:
    executable: /bin/bash
  register: _parts
  changed_when: false
  tags: [slurm_validate]

- name: Assert CPU partition exists
  ansible.builtin.assert:
    that:
      - slurm_validate_partitions.cpu in _parts.stdout_lines
    fail_msg: "Missing CPU partition '{{ slurm_validate_partitions.cpu }}'. Got: {{ _parts.stdout_lines }}"
  tags: [slurm_validate]

- name: Assert GPU partition exists
  ansible.builtin.assert:
    that:
      - slurm_validate_partitions.gpu in _parts.stdout_lines
    fail_msg: "Missing GPU partition '{{ slurm_validate_partitions.gpu }}'. Got: {{ _parts.stdout_lines }}"
  tags: [slurm_validate]

- name: Ensure no nodes are DOWN/DRAIN/FAIL (basic)
  ansible.builtin.shell: |
    set -euo pipefail
    sinfo -N -h -o "%N %t" | awk '{print $2}' | egrep -i 'down|drain|fail'
  args:
    executable: /bin/bash
  register: _bad_states
  changed_when: false
  failed_when: _bad_states.rc == 0
  tags: [slurm_validate]

- name: srun hostname (CPU partition)
  ansible.builtin.command: >
    srun -N1 -n1 -p {{ slurm_validate_partitions.cpu }} hostname
  register: _srun_cpu_hostname
  changed_when: false
  tags: [slurm_validate]

- name: srun nvidia-smi -L (GPU partition)
  ansible.builtin.command: >
    srun -N1 -n1 -p {{ slurm_validate_partitions.gpu }} --gres=gpu:1 nvidia-smi -L
  register: _srun_gpu_nvsmi_l
  changed_when: false
  tags: [slurm_validate]

- name: Torch import probe on GPU node (auto mode)
  ansible.builtin.shell: |
    set -euo pipefail
    srun -N1 -n1 -p {{ slurm_validate_partitions.gpu }} --gres=gpu:1 bash -lc '
      set -euo pipefail
      {{ slurm_validate_torch.prelude }}
      {{ slurm_validate_torch.python }} -c "import torch; print(torch.__version__)"
    '
  args:
    executable: /bin/bash
  register: _torch_probe
  changed_when: false
  failed_when: false
  when: slurm_validate_torch.enabled in ["auto", "true"]
  tags: [slurm_validate]

- name: PyTorch CUDA smoke (runs only if probe succeeded or enabled=true)
  ansible.builtin.shell: |
    set -euo pipefail
    srun -N1 -n1 -p {{ slurm_validate_partitions.gpu }} --gres=gpu:1 bash -lc '
      set -euo pipefail
      {{ slurm_validate_torch.prelude }}
      {{ slurm_validate_torch.python }} - << "PY"
    import torch
    print("torch:", torch.__version__)
    print("torch.version.cuda:", torch.version.cuda)
    print("cuda_available:", torch.cuda.is_available())
    if torch.cuda.is_available():
        print("gpu:", torch.cuda.get_device_name(0))
    PY
        '
  args:
    executable: /bin/bash
  register: _torch_smoke
  changed_when: false
  when: >
    slurm_validate_torch.enabled == "true"
    or (slurm_validate_torch.enabled == "auto" and _torch_probe is defined and _torch_probe.rc == 0)
  tags: [slurm_validate]

- name: Render smoke scripts (CPU/GPU)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ slurm_validate_smoke.workdir }}/{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: "slurm-smoke-cpu.sbatch.j2", dest: "slurm-smoke-cpu.sbatch" }
    - { src: "slurm-smoke-gpu.sbatch.j2", dest: "slurm-smoke-gpu.sbatch" }
  changed_when: false
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]

- name: Submit CPU smoke job
  ansible.builtin.command: >
    sbatch --parsable {{ slurm_validate_smoke.workdir }}/slurm-smoke-cpu.sbatch
  register: _cpu_jobid
  changed_when: false
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]

- name: Wait CPU job leaves queue
  ansible.builtin.shell: |
    set -euo pipefail
    squeue -h -j {{ _cpu_jobid.stdout }} | wc -l
  args:
    executable: /bin/bash
  register: _cpu_in_queue
  changed_when: false
  until: _cpu_in_queue.stdout | int == 0
  retries: "{{ (slurm_validate_smoke.timeout_seconds // slurm_validate_smoke.poll_delay_seconds) | int }}"
  delay: "{{ slurm_validate_smoke.poll_delay_seconds }}"
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]

- name: Check CPU job sacct state
  ansible.builtin.shell: |
    set -euo pipefail
    sacct -n -P -j {{ _cpu_jobid.stdout }} -o JobID,State,ExitCode | awk -F'|' '$1=="{{ _cpu_jobid.stdout }}" {print $2"|" $3; exit}'
  args:
    executable: /bin/bash
  register: _cpu_sacct
  changed_when: false
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]

- name: Assert CPU job COMPLETED with 0:0
  ansible.builtin.assert:
    that:
      - _cpu_sacct.stdout is match("^COMPLETED\\|0:0")
    fail_msg: "CPU smoke failed. sacct={{ _cpu_sacct.stdout }}"
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]

- name: Submit GPU smoke job
  ansible.builtin.command: >
    sbatch --parsable {{ slurm_validate_smoke.workdir }}/slurm-smoke-gpu.sbatch
  register: _gpu_jobid
  changed_when: false
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]

- name: Wait GPU job leaves queue
  ansible.builtin.shell: |
    set -euo pipefail
    squeue -h -j {{ _gpu_jobid.stdout }} | wc -l
  args:
    executable: /bin/bash
  register: _gpu_in_queue
  changed_when: false
  until: _gpu_in_queue.stdout | int == 0
  retries: "{{ (slurm_validate_smoke.timeout_seconds // slurm_validate_smoke.poll_delay_seconds) | int }}"
  delay: "{{ slurm_validate_smoke.poll_delay_seconds }}"
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]

- name: Check GPU job sacct state
  ansible.builtin.shell: |
    set -euo pipefail
    sacct -n -P -j {{ _gpu_jobid.stdout }} -o JobID,State,ExitCode | awk -F'|' '$1=="{{ _gpu_jobid.stdout }}" {print $2"|" $3; exit}'
  args:
    executable: /bin/bash
  register: _gpu_sacct
  changed_when: false
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]

- name: Assert GPU job COMPLETED with 0:0
  ansible.builtin.assert:
    that:
      - _gpu_sacct.stdout is match("^COMPLETED\\|0:0")
    fail_msg: "GPU smoke failed. sacct={{ _gpu_sacct.stdout }}"
  when: slurm_validate_smoke.enabled | bool
  tags: [slurm_validate, slurm_validate_smoke]
