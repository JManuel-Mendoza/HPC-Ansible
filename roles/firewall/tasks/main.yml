# Proposito:
# - Implementar tareas del rol 'firewall' para aplicar reglas de firewall para trafico interno y servicios HPC.
# Supuestos/prerrequisitos:
# - El play debe ejecutar con privilegios adecuados y facts disponibles; se asume conectividad al host objetivo.
# Variables clave consumidas:
# - roles/firewall/defaults/main.yml (si existe), group_vars/* y host_vars/* segun alcance.
# Tags relevantes:
# - Heredadas desde site.yml y/o invocaciones parciales por --tags.

---
- name: Asegurar firewalld instalado
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Habilitar firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Permitir SSH
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    state: enabled
    immediate: true
  notify: Firewall | Recargar firewalld

# -------------------------------------------------------------------
# Slurm - allow controller <-> compute traffic only from internal CIDR
# Ports:
# - 6817/tcp: slurmctld (controller on master)
# - 6818/tcp: slurmd (daemon on compute nodes)
# -------------------------------------------------------------------

- name: Firewall | Slurm | Allow slurmctld (6817/tcp) from internal network (masters)
  ansible.posix.firewalld:
    zone: "{{ slurm_firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
    rich_rule: >-
      rule family="ipv4"
      source address="{{ slurm_internal_cidr }}"
      port port="{{ slurmctld_port }}" protocol="tcp"
      accept
  notify: Firewall | Recargar firewalld
  when:
    - slurm_internal_cidr is defined
    - inventory_hostname in groups.get('hpc_master', [])
  tags: [firewall, slurm, slurm_firewall]

- name: Firewall | Slurm | Allow slurmd (6818/tcp) from internal network (compute)
  ansible.posix.firewalld:
    zone: "{{ slurm_firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
    rich_rule: >-
      rule family="ipv4"
      source address="{{ slurm_internal_cidr }}"
      port port="{{ slurmd_port }}" protocol="tcp"
      accept
  notify: Firewall | Recargar firewalld
  when:
    - slurm_internal_cidr is defined
    # Ajusta el grupo según tu inventario actual:
    - inventory_hostname in (groups.get('workers_r', []) + groups.get('workers', []))
  tags: [firewall, slurm, slurm_firewall]

- name: Firewall | Slurm | Show rich rules (debug)
  ansible.builtin.command: firewall-cmd --zone={{ slurm_firewalld_zone }} --list-rich-rules
  changed_when: false
  when:
    - slurm_internal_cidr is defined
    - inventory_hostname in (groups.get('hpc_master', []) + groups.get('workers_r', []) + groups.get('workers', []))
  tags: [firewall, slurm, slurm_firewall, slurm_validate, debug, debug_firewall]

- name: Firewall | NCCL | Allow NCCL port range (20000-20100/tcp) from internal network (master)
  ansible.posix.firewalld:
    zone: "{{ slurm_firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
    rich_rule: >-
      rule family="ipv4"
      source address="{{ slurm_internal_cidr }}"
      port port="20000-20100" protocol="tcp"
      accept
  notify: Firewall | Recargar firewalld
  when:
    - slurm_internal_cidr is defined
    - inventory_hostname in groups.get('hpc_master', [])
  tags: [firewall, nccl, nccl_firewall]

- name: Firewall | NCCL | Allow torchrun rendezvous port (29500/tcp) from internal network (master)
  ansible.posix.firewalld:
    zone: "{{ slurm_firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
    rich_rule: >-
      rule family="ipv4"
      source address="{{ slurm_internal_cidr }}"
      port port="29500" protocol="tcp"
      accept
  notify: Firewall | Recargar firewalld
  when:
    - slurm_internal_cidr is defined
    - inventory_hostname in groups.get('hpc_master', [])
  tags: [firewall, nccl, nccl_firewall]

# -------------------------------------------------------------------
# NCCL (PyTorch DDP) - allow inter-worker GPU communication
# Port range 20000-20100/tcp on the internal cluster network
# Only needed on compute/worker nodes
# -------------------------------------------------------------------

- name: Firewall | NCCL | Allow NCCL port range (20000-20100/tcp) from internal network
  ansible.posix.firewalld:
    zone: "{{ slurm_firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
    rich_rule: >-
      rule family="ipv4"
      source address="{{ slurm_internal_cidr }}"
      port port="20000-20100" protocol="tcp"
      accept
  notify: Firewall | Recargar firewalld
  when:
    - slurm_internal_cidr is defined
    - inventory_hostname in (groups.get('workers_r', []) + groups.get('workers', []))
  tags: [firewall, nccl, nccl_firewall]

- name: Firewall | NCCL | Allow torchrun rendezvous port (29500/tcp) from internal network
  ansible.posix.firewalld:
    zone: "{{ slurm_firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
    rich_rule: >-
      rule family="ipv4"
      source address="{{ slurm_internal_cidr }}"
      port port="29500" protocol="tcp"
      accept
  notify: Firewall | Recargar firewalld
  when:
    - slurm_internal_cidr is defined
    - inventory_hostname in (groups.get('workers_r', []) + groups.get('workers', []))
  tags: [firewall, nccl, nccl_firewall]

- name: Firewall | Aplicar recargas pendientes antes de continuar
  ansible.builtin.meta: flush_handlers
  tags: [firewall]
