# Proposito:
# - Definir handlers del rol 'nvidia_cuda' para aplicar cambios diferidos solo cuando hay notify.
# Supuestos/prerrequisitos:
# - Los handlers se ejecutan al final del play o tras flush_handlers; requieren servicios instalados previamente.
# Variables clave consumidas:
# - Parametros definidos en defaults/vars del rol y estados calculados por tasks que notifican.
# Tags relevantes:
# - No aplican tags directas; se activan por notify desde tasks etiquetadas.

---
- name: Rebuild initramfs (RHEL)
  ansible.builtin.command: dracut --force
  changed_when: true
  when: ansible_facts['os_family'] == 'RedHat'
  listen: Rebuild initramfs

- name: Rebuild initramfs (Ubuntu)
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  when: ansible_facts['os_family'] == 'Debian'
  listen: Rebuild initramfs

- name: Reboot node
  ansible.builtin.reboot:
    reboot_timeout: 1800
  when: nvidia_cuda_reboot | bool
    and inventory_hostname not in groups.get('hpc_master', [])

- name: NVIDIA/CUDA | Informar reinicio manual en master
  ansible.builtin.debug:
    msg: >-
      El nodo master requiere reinicio manual. Ejecute: sudo reboot
      Después del reinicio del master ejecute nuevamente: 
      ansible-playbook site.yml -t cuda
  when:
    - nvidia_cuda_reboot | bool
    - inventory_hostname in groups.get('hpc_master', [])
  listen: Reboot node
