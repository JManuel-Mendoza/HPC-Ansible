# Proposito:
# - Implementar tareas del rol 'slurm_identities' para asegurar usuarios y grupos de servicio Slurm/Munge.
# Supuestos/prerrequisitos:
# - El play debe ejecutar con privilegios adecuados y facts disponibles; se asume conectividad al host objetivo.
# Variables clave consumidas:
# - roles/slurm_identities/defaults/main.yml (si existe), group_vars/* y host_vars/* segun alcance.
# Tags relevantes:
# - Heredadas desde site.yml y/o invocaciones parciales por --tags.

- name: Choose nologin shell (varies by distro)
  ansible.builtin.set_fact:
    nologin_shell: "{{ '/usr/sbin/nologin' if (ansible_facts['distribution'] in ['Ubuntu', 'Debian']) else '/sbin/nologin' }}"

- name: Ensure munge group exists
  ansible.builtin.group:
    name: munge
    gid: "{{ munge_gid }}"
    state: present

- name: Ensure munge user exists
  ansible.builtin.user:
    name: munge
    comment: "MUNGE Uid 'N' Gid Emporium"
    uid: "{{ munge_uid }}"
    group: munge
    home: /var/lib/munge
    create_home: true
    shell: "{{ nologin_shell }}"
    state: present

- name: Ensure slurm group exists
  ansible.builtin.group:
    name: slurm
    gid: "{{ slurm_gid }}"
    state: present

- name: Ensure slurm user exists
  ansible.builtin.user:
    name: slurm
    comment: "SLURM workload manager"
    uid: "{{ slurm_uid }}"
    group: slurm
    home: /var/lib/slurm
    create_home: true
    shell: /bin/bash
    state: present
