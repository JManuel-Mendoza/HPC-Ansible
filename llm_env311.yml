---
- name: Entorno LLM sobre Python 3.11
  hosts: all          # master, worker1, worker2
  become: true

  vars:
    llm_env_path: /opt/llm-env
    python311_bin: /usr/bin/python3.11

  tasks:
    - name: Instalar Python 3.11 y herramientas básicas
      ansible.builtin.dnf:
        name:
          - python3.11
          - python3.11-devel
          - python3.11-pip
          - gcc
          - gcc-c++
          - make
          - git
        state: present

    - name: Crear entorno virtual con Python 3.11
      ansible.builtin.command: "{{ python311_bin }} -m venv {{ llm_env_path }}"
      args:
        creates: "{{ llm_env_path }}/bin/activate"

    - name: Actualizar pip / setuptools / wheel dentro del entorno
      ansible.builtin.command: >
        {{ llm_env_path }}/bin/pip install --upgrade
        pip setuptools wheel

    - name: Instalar PyTorch CPU (mismo comando recomendado por PyTorch)
      ansible.builtin.command: >
        {{ llm_env_path }}/bin/pip install
        torch torchvision torchaudio
        --index-url https://download.pytorch.org/whl/cpu

    - name: Instalar stack Hugging Face y utilidades LLM
      ansible.builtin.command: >
        {{ llm_env_path }}/bin/pip install
        "transformers"
        "datasets"
        "accelerate"
        "peft"
        "huggingface-hub"
        "sentencepiece"
        "evaluate"
        "tensorboard"
        "tqdm"
